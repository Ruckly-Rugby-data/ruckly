<style>
:root{color-scheme:dark;--bg:#07132f;--card:#10234e;--tx:#edf4ff;--mut:#94a7cf;--ok:#4bd3a6;--ko:#ff8292;--sh:#f2a33a;--ac:#3b7df0;--fl:#294994;--ln:#e0edff;--bd:#294a83;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#12295b,#07132f 48%) fixed,var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;max-width:520px;margin-inline:auto;padding:12px}
h1{font-size:20px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:10px 2px;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:linear-gradient(145deg,rgba(16,35,78,.97),rgba(11,26,59,.97));box-shadow:0 14px 30px rgba(1,8,25,.18);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.seg button{padding:10px 2px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;font-size:13px;line-height:1.2}
.seg button.on{color:#fff}
.seg .made.on{background:var(--ok);border-color:var(--ok)}
.seg .left.on,.seg .right.on{background:var(--ko);border-color:var(--ko)}
.seg .short.on{background:var(--sh);border-color:var(--sh)}
svg{width:100%;height:auto;display:block;border-radius:10px;touch-action:manipulation}
.big{font-size:34px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.zones div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.zones b{display:block;font-size:18px}
.ctr{display:flex;align-items:center;gap:8px}
.ctr button{width:44px;height:44px;border-radius:50%;border:none;font-size:22px;font-weight:700;color:#fff}
.ctr .p{background:var(--ok)}.ctr .m{background:var(--ko)}
.ctr span{min-width:28px;text-align:center;font-size:20px;font-weight:700}
.stat{padding:10px 0;border-top:1px solid var(--bd)}.stat:first-child{border-top:0}
.link{background:none;border:none;color:var(--mut);text-decoration:underline;font-size:14px;padding:6px}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:16px 16px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(0,0,0,.25);z-index:20}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.segs button,.acts button{padding:11px 2px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;font-size:13px;line-height:1.2}
.segs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.acts{display:flex;gap:8px}.acts button{flex:1;font-size:15px;padding:12px}
.acts .del{color:var(--ko);border-color:var(--ko)}
.hide{display:none}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;border-radius:0}
.tyrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.tyrow button{padding:10px 2px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;font-size:13px}
.tyrow button.on{background:var(--ac);border-color:var(--ac);color:#fff}
body{padding-bottom:84px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:15}
.nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:20px}.nav .on{color:var(--ac);font-weight:700}
.drop{display:block;border:2px dashed var(--ac);border-radius:14px;padding:24px 12px;text-align:center;color:var(--ac);font-weight:600;margin-bottom:12px}
.drop.over{background:var(--card)}
.hl input,.hl textarea{width:100%;padding:10px;margin-bottom:6px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.hl a{color:var(--ac);font-weight:600;word-break:break-all}
.ctr .u{background:var(--mut);width:34px;height:34px;font-size:18px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.meta input,.meta select{padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
.meta .full{grid-column:1/3}
.save{width:100%;padding:12px;border:none;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;font-size:15px;margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}.brand{font-weight:700;font-size:18px;letter-spacing:-.02em}.brand span{color:var(--ac)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e7f0ff;color:#345990;font-size:11px;font-weight:700}
.eyebrow{color:#79a7f9;font-size:10px;font-weight:700;letter-spacing:.14em;margin:0}
textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:#0a1839;color:var(--tx);font:inherit;resize:vertical}
.meta input,.meta select{background:#0a1839}.tabs button.on,.save,.segs button.on,.tyrow button.on{background:var(--ac)}
.seg .left.on,.seg .right.on{color:#07132f}.seg .made.on{color:#07132f}
#dots circle{filter:drop-shadow(0 0 5px rgba(255,255,255,.55))}
.nav{background:rgba(9,23,52,.96)}
.lab{display:block;font-size:12px;font-weight:700;margin:10px 0 6px}.ph{display:grid;justify-items:center;gap:6px;font-size:11px;color:#79a7f9;margin-bottom:6px;cursor:pointer}.av2{width:68px;height:68px;border-radius:50%;background:#eef3ff;display:grid;place-items:center;overflow:hidden}.av2 img{width:100%;height:100%;object-fit:cover}
.sc3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sc3 .card{margin:0;padding:12px}.sc3 span{font-size:11px;font-weight:700;display:block}.sc3 b{font-size:22px}
.srow{display:flex;align-items:center;gap:8px;padding:11px 0}.srow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.srow .mut{font-size:12px}.ib{background:none;border:0;padding:4px;color:var(--mut);display:grid}.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

<script>
const KEY="rugbystats.v1";
let S={kicks:[],tk:{ok:0,ko:0},ps:{ok:0,ko:0},mode:"made"};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.meta)S.meta={type:"training",name:"",date:new Date().toLocaleDateString("sv")};
if(!S.sessions)S.sessions=[];
if(!S.hl)S.hl=[];
if(!S.me)S.me={name:"",handle:"",bio:""};
if(!S.br)S.br=0;if(!S.tr)S.tr=0;if(!S.kg)S.kg={ok:0,ko:0};if(!S.ty)S.ty="pen";
if(!S.mode||S.mode==="ok"||S.mode==="ko")S.mode="made";
if(!S.v){S.kicks.forEach(k=>{k.y+=10});S.v=2;save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const PX=300/70,GY=30;
const dist=(x,y)=>Math.hypot(x-150,y-GY)/PX;
const zone=d=>d<15?0:d<30?1:d<45?2:3;
const ZN=["0–15 m","15–30 m","30–45 m","45 m+"];
const pc=(a,b)=>b?Math.round(100*a/b)+"%":"–";
// old saved kicks had only ok:true/false
const res=k=>k.res||(k.ok?"made":"miss");
const COL={made:"#2ecc71",left:"#ff5a4a",right:"#ff5a4a",short:"#f0a030",miss:"#ff5a4a"};
const LBL={made:"made",left:"wide left",right:"wide right",short:"short",miss:"missed"};
const PTS={conv:2,pen:3,drop:3},TS={conv:"Conv",pen:"Pen",drop:"Drop"};
const kt=k=>k.t||"pen",kp=k=>res(k)==="made"?PTS[kt(k)]:0;
function end(k){
  const r=res(k);
  if(r==="made")return[150,16];
  if(r==="left")return[118,14];
  if(r==="right")return[182,14];
  if(r==="short"){const t=.62;return[k.x+(150-k.x)*t,k.y+(21-k.y)*t]}
  return null;
}
function render(){
  $("lines").innerHTML=S.kicks.map(k=>{const e=end(k);if(!e)return"";const c=COL[res(k)];
    const tip=res(k)==="short"?`<circle cx="${e[0]}" cy="${e[1]}" r="3.5" fill="${c}"/>`:"";

 $("pva").innerHTML=`<div class="act" style="margin-top:8px"><button data-plk="1" aria-label="${l.me?"Unlike":"Like"}" aria-pressed="${l.me}">${pvHeart(l.me)}</button><span class="mut">${l.n}</span><span class="mut" style="margin-left:8px">💬 ${FD.cc[id]!=null?FD.cc[id]:"–"}</span><span style="flex:1"></span>${mine?(p.kind==="video"?'<button class="link" data-ped="1">Edit</button>':"")+'<button class="link" data-pdp="1">Delete</button>':'<button class="link" data-prp="1">Report</button>'}</div>${p.caption?`<div><b>@${esc(p.u.handle)}</b> ${cap(p.caption)}</div>`:""}`}
function pvComs(){const p=PVD[PV.k];$("pvi").classList.toggle("hide",!!p.local);if(p.local){$("pvc").innerHTML="";return}
 const id=p.id,mine=p.u.id===user.id,cm=FD.cm[id];
 $("pvc").innerHTML=!cm?'<div class="mut" style="padding:8px 0">Loading…</div>':cm.length?cm.map(c=>{const a=c.user_id===user.id?{handle:S.me.handle||"you"}:(FD.pr[c.user_id]||{});
  return`<div class="sr2" style="padding:6px 0"><span><b>@${esc(a.handle||"player")}</b> ${cap(c.body)}<span class="mut" style="font-size:12px"> · ${ago(c.created_at)}</span></span>${c.user_id===user.id||mine?`<button class="link" data-pcd="${c.id}" aria-label="Delete comment">✕</button>`:""}</div>`}).join(""):'<div class="mut" style="padding:8px 0">No comments yet. Be the first.</div>'}
async function pvLoad(k){const p=PVD[k];if(p.local)return;const id=p.id;
 const[l,c]=await Promise.all([sb.from("likes").select("user_id").eq("post_id",id),sb.from("comments").select("id,user_id,body,created_at").eq("post_id",id).order("created_at")]);
 if(PV.k!==k)return;
 if(!l.error)FD.lk[id]={n:(l.data||[]).length,me:(l.data||[]).some(x=>x.user_id===user.id)};
 if(!c.error){FD.cm[id]=c.data||[];FD.cc[id]=FD.cm[id].length;const miss=[...new Set(FD.cm[id].map(x=>x.user_id))].filter(u=>u!==user.id&&!FD.pr[u]);
  if(miss.length)((await sb.from("profiles").select("id,name,handle,role,pos,private").in("id",miss)).data||[]).forEach(x=>FD.pr[x.id]=x)}
 if(PV.k===k){pvActs();pvComs()}}
function pvShow(k){PV.k=k;pvHead();pvMedia();pvActs();pvComs();$("pvci").value="";$("pv").querySelector(".pvc").scrollTop=0;pvLoad(k)}
function pvOpen(k,list){if(!PVD[k])return;PV={open:true,k,list:list&&list.length?list:[k],prev:document.activeElement};$("pv").classList.remove("hide");document.body.style.overflow="hidden";pvShow(k);$("pv").querySelector("[data-pcx]").focus()}
function pvClose(){if(!PV.open)return;PV.open=false;const v=$("pvm").querySelector("video");if(v)v.pause();$("pvm").innerHTML="";$("pv").classList.add("hide");document.body.style.overflow="";if(PV.prev&&document.contains(PV.prev))try{PV.prev.focus()}catch(e){}}
function pvGo(d){const i=PV.list.indexOf(PV.k)+d;if(i<0||i>=PV.list.length)return;const v=$("pvm").querySelector("video");if(v)v.pause();pvShow(PV.list[i])}
async function pvOpenId(id){const r=await sb.from("posts").select("id,kind,caption,media_path,session,created_at").eq("id",id).maybeSingle();
 if(r.error||!r.data)return toast("This post isn’t available anymore.");pvReg([r.data],{id:user.id,name:S.me.name||"You",handle:S.me.handle||"",pos:S.me.pos});pvOpen("p:"+r.data.id,["p:"+r.data.id])}
async function pvLike(){const p=PVD[PV.k],id=p.id,l=FD.lk[id]=FD.lk[id]||{n:0,me:false},on=!l.me;l.me=on;l.n+=on?1:-1;pvActs();
 const r=on?await sb.from("likes").insert({post_id:id,user_id:user.id}):await sb.from("likes").delete().eq("post_id",id).eq("user_id",user.id);
 if(r.error){l.me=!on;l.n+=on?-1:1;pvActs();toast("Couldn’t update your like: "+r.error.message)}}
async function pvComment(){const p=PVD[PV.k],i=$("pvci"),t=i.value.trim();if(!t||p.local)return;
 const{data,error}=await sb.from("comments").insert({post_id:p.id,user_id:user.id,body:t}).select("id,user_id,body,created_at").single();
 if(error)return toast("You can’t comment on this post (the author limited comments).");
 (FD.cm[p.id]=FD.cm[p.id]||[]).push(data);FD.cc[p.id]=FD.cm[p.id].length;i.value="";pvActs();pvComs()}
document.body.insertAdjacentHTML("beforeend",'<div class="ov hide" id="pv" role="dialog" aria-modal="true" aria-label="Post"><div class="card pvc"><div class="pvh" id="pvh"></div><div id="pvm"></div><div id="pva"></div><div id="pvc" aria-live="polite"></div><div class="pvi" id="pvi"><input id="pvci" placeholder="Add a comment…" maxlength="300" autocomplete="off" aria-label="Add a comment"><button class="fb on" data-pcs="1">Post</button></div></div></div>');
$("pvci").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();pvComment()}});
$("pv").addEventListener("click",async e=>{if(e.target.id==="pv")return pvClose();const b=e.target.closest("button");if(!b)return;const d=b.dataset,p=PVD[PV.k];
 if(d.pcx)return pvClose();if(d.pnv)return pvGo(+d.pnv);
 if(d.pup){pvClose();return openProf(d.pup)}
 if(d.plk)return pvLike();if(d.pcs)return pvComment();
 if(d.pcd){const id=d.pcd,pid=p.id,{error}=await sb.from("comments").delete().eq("id",id);if(error)return toast("Couldn’t delete the comment.");FD.cm[pid]=(FD.cm[pid]||[]).filter(c=>String(c.id)!==String(id));FD.cc[pid]=FD.cm[pid].length;pvActs();pvComs();return}
 if(d.ped){const all=await vAll().catch(()=>[]),v=p.local?all.find(x=>x.id===p.id):all.find(x=>String(x.postId)===String(p.id));pvClose();if(v)openPost(null,v);else if(!p.local)openPost(null,{cloud:true,id:p.id,cap:p.caption||"",url:pubUrl(p.media_path)});return}
 if(d.prp)return reportDlg(p.u.id,p.id);
 if(d.pdp)return ask("Delete this post?","It will be removed from your account and from the feed for everyone. This can’t be undone.","Delete",async()=>{if(await delPost(p.id,p.media_path)){toast("Post deleted");pvClose();pvRefresh()}});
 if(d.pdl)return ask("Delete this video?","It will be permanently deleted from this device.","Delete",async()=>{try{await vDel(p.id)}catch(x){}pvClose();pvRefresh()})});
document.addEventListener("click",e=>{const b=e.target.closest("[data-po]");if(!b)return;const k=b.dataset.po;if(!k.startsWith("l:")&&(!user||!sb))return;
 pvOpen(k,[...b.parentElement.querySelectorAll("[data-po]")].map(x=>x.dataset.po))});
document.addEventListener("keydown",e=>{if(!PV.open)return;if(e.key==="Escape"){e.stopPropagation();pvClose()}
 else if((e.key==="ArrowLeft"||e.key==="ArrowRight")&&!/INPUT|TEXTAREA/.test((e.target||{}).tagName||"")){pvGo(e.key==="ArrowLeft"?-1:1)}},true);

/* ===== SEARCH: find people by name or @username ===== */
async function srch(q){const n=++sq0;q=(q===undefined?$("sq").value:q).trim().replace(/^@/,"").replace(/[,()%*]/g,"");
 let rows=[],lbl=q?"Results":"Suggested accounts",msg="";
 const map=p=>({id:p.id,name:p.name||"Player",handle:p.handle,pos:p.pos,priv:p.private,tag:(RL[p.role]||"Player")+(p.pos?" · "+p.pos:"")});
 if(sb&&user){try{
   let r=await sb.rpc("search_profiles",{q});
   if(r.error){let t=sb.from("profiles").select("id,name,handle,role,pos,private,settings").neq("id",user.id).limit(60);
    t=q?t.or(`name.ilike.%${q}%,handle.ilike.%${q}%`):t.order("created_at",{ascending:false});
    r=await t;if(r.error)throw r.error;
    r.data=(r.data||[]).filter(p=>p.handle&&!(p.settings&&p.settings.discoverable===false)&&!FD.blocked.includes(p.id))}
   rows=(r.data||[]).map(map);if(!q)rows.sort((a,b)=>(b.pos===S.me.pos)-(a.pos===S.me.pos));
   const f=await sb.from("follows").select("followee_id,status").eq("follower_id",user.id);if(!f.error){FD.fol={};(f.data||[]).forEach(x=>FD.fol[x.followee_id]=x.status)}
  }catch(e){msg="Couldn’t load accounts."}}
 else if(sb)msg="Log in to search players.";else msg="Online accounts are not connected.";
 if(n!==sq0)return;
 $("sr").innerHTML=msg?`<div class="card mut">${msg}</div>`:`<b>${lbl}</b><div style="margin-top:8px">${rows.map(srR).join("")||'<div class="card mut">No players found.</div>'}</div>`}
$("sr").addEventListener("click",async e=>{const b=e.target.closest("[data-sfo]");if(!b||!user)return;const id=b.dataset.sfo,priv=b.dataset.pv==="1";
 const go=async()=>{b.disabled=true;const cur=FD.fol[id];let r;
  if(cur)r=await sb.from("follows").delete().eq("follower_id",user.id).eq("followee_id",id);
  else r=await sb.from("follows").insert({follower_id:user.id,followee_id:id,status:priv?"pending":"accepted"});
  b.disabled=false;if(r.error)return toast("Couldn’t update: "+r.error.message);
  if(cur)delete FD.fol[id];else{FD.fol[id]=priv?"pending":"accepted";if(priv)toast("Request sent")}
  const s=FD.fol[id];b.textContent=s==="accepted"?"Following":s==="pending"?"Requested":priv?"Request":"Follow";b.classList.toggle("on",!!s)};
 if(FD.fol[id]==="accepted")ask("Unfollow this player?","You can follow them again at any time.","Unfollow",go);else go()});

/* ===== TRAJECTORIES (feed, post page, grid tiles) ===== */
function ktraj(kk,w){const col={m:"#2ecc71",l:"#ff5a4a",r:"#ff5a4a",s:"#f0a030"};
 return kk.map(k=>{const x=+k[0],y=+k[1],r=k[2],e=r==="m"?[150,16]:r==="l"?[118,14]:r==="r"?[182,14]:r==="s"?[x+(150-x)*.62,y+(21-y)*.62]:null;if(!e)return"";const c=col[r];
  return`<line x1="${x}" y1="${y}" x2="${e[0]}" y2="${e[1]}" stroke="${c}" stroke-width="${w}" stroke-dasharray="${w*2.8} ${w*2.2}" stroke-linecap="round" opacity=".9"/>`+(r==="s"?`<circle cx="${e[0]}" cy="${e[1]}" r="${w*1.8}" fill="${c}"/>`:"")}).join("")}
function kmini(kk){const col={m:"#2ecc71",l:"#ff5a4a",r:"#ff5a4a",s:"#f0a030"},dots=kk.map(k=>`<circle cx="${+k[0]}" cy="${+k[1]}" r="7" fill="${col[k[2]]||"#ff5a4a"}" stroke="#fff" stroke-width="2"/>`).join("");
 return`<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;border-radius:0"><rect width="300" height="300" fill="var(--fl)"/><rect width="300" height="30" fill="#000" opacity=".13"/><g stroke="var(--ln)" stroke-width="3" fill="none" opacity=".8"><line x1="0" y1="30" x2="300" y2="30"/><line x1="0" y1="124" x2="300" y2="124"/></g><g stroke="#fff" stroke-width="5"><line x1="140" y1="30" x2="140" y2="8"/><line x1="160" y1="30" x2="160" y2="8"/><line x1="140" y1="19" x2="160" y2="19"/></g>${ktraj(kk,4)}${dots}</svg>`}

/* ===== VIDEO UPLOAD: readable errors + automatic shrinking of big videos ===== */
const upMsg=e=>{const m=String((e&&e.message)||e||"");
 if(/bucket not found/i.test(m))return"Video storage isn’t set up yet. Run supabase-storage.sql in Supabase, then try again.";
 if(/row-level security|policy|not authorized|permission/i.test(m))return"Supabase is blocking this upload. Run supabase-storage.sql in Supabase, then try again.";
 if(/exceed|too large|payload|maximum/i.test(m))return"This video is too large for the server (50 MB max).";
 return"Upload failed: "+m};
async function compressVideo(file,onp){
 const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();try{ac.resume()}catch(e){}
 const url=URL.createObjectURL(file),v=document.createElement("video");v.src=url;v.playsInline=true;v.preload="auto";
 try{
  await new Promise((ok,ko)=>{v.onloadedmetadata=ok;v.onerror=()=>ko(new Error("This video format can’t be read here."))});
  const dur=v.duration;if(!isFinite(dur)||dur<=0||!v.videoWidth)throw new Error("Unreadable video");
  const sc=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),w=Math.round(v.videoWidth*sc/2)*2,h=Math.round(v.videoHeight*sc/2)*2;
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const g=cv.getContext("2d");
  const bits=Math.max(5e5,Math.min(2.5e6,44*8*1048576/dur-128e3));
  const dst=ac.createMediaStreamDestination();ac.createMediaElementSource(v).connect(dst);
  const st=new MediaStream([...cv.captureStream(30).getVideoTracks(),...dst.stream.getAudioTracks()]);
  const mt=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!mt)throw new Error("Recording isn’t supported by this browser.");
  const rec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:bits,audioBitsPerSecond:96e3}),ch=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
  const stopped=new Promise(r=>rec.onstop=r),ended=new Promise(r=>v.onended=r);
  let raf;const draw=()=>{g.drawImage(v,0,0,w,h);onp(Math.min(1,v.currentTime/dur));raf=requestAnimationFrame(draw)};
  rec.start(1000);await v.play();draw();await ended;cancelAnimationFrame(raf);rec.stop();await stopped;
  return new Blob(ch,{type:mt.split(";")[0]})
 }finally{URL.revokeObjectURL(url);try{ac.close()}catch(e){}}}
async function compressUi(f){const o=document.createElement("div");o.className="ov";o.style.zIndex=95;
 o.innerHTML='<div class="card" style="width:min(100%,340px);padding:18px;text-align:center" role="alertdialog" aria-live="polite"><b>Optimising your video…</b><p class="mut" id="cpt" style="font-size:22px;margin:10px 0">0%</p><div class="mut" style="font-size:12px">This video is over 50 MB, so it is being shrunk to be shared. Keep this tab open and in front until it’s done.</div></div>';
 document.body.appendChild(o);
 try{const b=await compressVideo(f,p=>{$("cpt").textContent=Math.round(p*100)+"%"});return b&&b.size>0?b:null}
 catch(e){toast("Couldn’t shrink this video: "+((e&&e.message)||"unknown error")+" It stays on this device.");return null}
 finally{o.remove()}}
